version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cyberlab_postgres
    environment:
      POSTGRES_DB: cyberlab
      POSTGRES_USER: cyber
      POSTGRES_PASSWORD: cyberpass123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cyberlab_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyber -d cyberlab"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cyberlab_backend
    environment:
      DATABASE_URL: postgresql://cyber:cyberpass123@postgres:5432/cyberlab
      PYTHONUNBUFFERED: 1
      # Modelo Whisper: tiny, base, small, medium, large-v2
      # large-v2 = melhor qualidade (requer mais RAM/GPU)
      # medium = equilíbrio qualidade/velocidade
      # small = rápido e boa qualidade (RECOMENDADO)
      # base = mais rápido mas menos preciso
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # 1 = modo rápido (melhor tempo), 0 = modo qualidade
      WHISPER_SPEED_MODE: ${WHISPER_SPEED_MODE:-1}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE:-1}
      WHISPER_BEST_OF: ${WHISPER_BEST_OF:-1}
      WHISPER_TEMPERATURE: ${WHISPER_TEMPERATURE:-0.0}
      # Token HuggingFace para diarização (identificação de locutores)
      # Obtenha em: https://huggingface.co/settings/tokens
      HF_TOKEN: ${HF_TOKEN:-}
      PYANNOTE_TOKEN: ${PYANNOTE_TOKEN:-}
    volumes:
      - .:/app
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - whisper_cache:/root/.cache/whisper
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cyberlab_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cyberlab_frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cyberlab_network
    restart: unless-stopped
    stdin_open: true
    tty: true

networks:
  cyberlab_network:
    driver: bridge

volumes:
  postgres_data:
  whisper_cache: